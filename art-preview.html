<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>냥공부 · 그림 확인</title>
<link rel="stylesheet" href="painted.css?v=20261006b">
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#faf5ec;color:#70584f;font-family:system-ui,sans-serif}main{max-width:1080px;margin:auto}h1{font-size:24px}h2{font-size:18px;margin-top:30px}p{line-height:1.6;font-size:14px}a{color:inherit}.rooms{display:grid;grid-template-columns:1fr 1fr;gap:24px}.room{height:370px;position:relative;overflow:hidden;border-radius:22px}.room .catwrap{position:absolute;left:calc(50% - 80px)}.rmwrap{position:absolute;inset:0}.ri{position:absolute}.ri svg{width:100%;height:auto}.ri-floorC{left:50%;transform:translateX(-50%)}.cat{width:100%;height:100%}.poses,.items{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.sample{padding:12px;text-align:center;border-radius:16px;background:#fffdf8}.sample .cat{width:100%;height:150px}.sample>svg.painted-asset{width:100%;height:140px}.sample p{margin:8px 0 0}.pose-study .paint-idle{display:none}.pose-study .paint-study{display:inline}.theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.theme-grid figure{margin:0;background:#fff;border-radius:16px;overflow:hidden}.theme-grid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.theme-grid figcaption{padding:8px 10px;font-weight:700}@media(max-width:700px){body{padding:16px}.rooms{grid-template-columns:1fr}.poses,.items{grid-template-columns:repeat(3,1fr)}.theme-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sample .cat,.sample>svg.painted-asset{height:110px}.room{height:340px}}
</style></head><body><main>
<h1>냥공부 그림 확인</h1><p>방은 빈 상태(0)에서 완성(5)까지, 같은 그림의 요소가 하나씩 늘어나요. 고양이도 테마마다 자세별 완성 그림을 씁니다. <a href="./">냥공부로 돌아가기</a></p>
<h2>할로윈 방 · 빈 방에서 완성까지</h2><div class="rooms" id="roomSteps"></div>
<h2>테마별 완성 방</h2><div class="theme-grid" id="themeGrid"></div>
<h2 id="wearposes">자세별 고양이 테마</h2><div id="themeCats"></div><h2>액자 28종</h2><div class="items" id="frames"></div>
<h2>기본 고양이 자세</h2><div class="poses" id="poses"></div>
</main><script src="deco.js?v=20261004a"></script><script src="painted.js?v=20261006b"></script><script>
document.querySelector('#roomSteps').innerHTML=Array.from({length:6},(_,level)=>`<figure style="margin:0"><div class="stage room" style="--room-art:url('assets/painted/room-halloween-${level}.webp')"><div class="catwrap" style="width:130px;height:130px;bottom:6%">${paintedCatSVG('halloween')}</div></div><figcaption>${level===0?'0 · 빈 방':level+' · '+(level===5?'완성':'업그레이드')}</figcaption></figure>`).join('');
document.querySelector('#themeGrid').innerHTML=[['basic','기본 방'],['mint','민트 방'],['lavender','라벤더 방'],['night','밤하늘 방'],['study','스터디룸'],['playroom','캣카페 놀이방'],['hanok','한옥 한가위'],['seolroom','설날 방'],['xmasroom','크리스마스 방'],['sakuraroom','벚꽃 방'],['halloween','할로윈 방'],['daebak','수능 대박 방']].map(([id,name])=>`<figure><img loading="lazy" src="assets/painted/room-${id}-5.webp" alt="${name} 완성 그림"><figcaption>${name}</figcaption></figure>`).join('');
const poses=[['앉기',''],['걷기','walking'],['잠자기','m-sleep'],['공부','pose-study'],['기쁨','happyface']];
document.querySelector('#poses').innerHTML=poses.map(([name,cls])=>`<div class="sample">${paintedCatSVG('basic').replace('cat painted-cat','cat painted-cat '+cls)}<p>${name}</p></div>`).join('');
document.querySelector('#themeCats').innerHTML=[['basic','기본'],['halloween','할로윈'],['chuseok','한가위'],['seollal','설날'],['christmas','크리스마스'],['spring','벚꽃']].map(([id,label])=>`<section><h3>${label} 고양이</h3><div class="poses">${poses.map(([name,cls])=>`<div class="sample">${paintedCatSVG(id).replace('cat painted-cat','cat painted-cat '+cls)}<p>${name}</p></div>`).join('')}</div></section>`).join('');
document.querySelector('#frames').innerHTML=Object.keys(PAINTED_FRAMES).map(id=>`<div class="sample"><div class="fsw" style="position:relative;width:120px;height:120px;margin:auto;${Object.entries(paintedFrameVars(id)).map(([k,v])=>k+':'+v).join(';')}"><div class="fsi" style="background:#debfa4 url('img/lemon/l08.jpg') center/cover"></div></div><p>${id}</p></div>`).join('');
</script></body></html>
