<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>냥공부 · 그림 확인</title>
<link rel="stylesheet" href="painted.css?v=20261005a">
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#faf5ec;color:#70584f;font-family:system-ui,sans-serif}main{max-width:1080px;margin:auto}h1{font-size:24px}h2{font-size:18px;margin-top:30px}p{line-height:1.6;font-size:14px}a{color:inherit}.rooms{display:grid;grid-template-columns:1fr 1fr;gap:24px}.room{height:370px;position:relative;overflow:hidden;border-radius:22px}.room .catwrap{position:absolute;left:calc(50% - 80px)}.rmwrap{position:absolute;inset:0}.ri{position:absolute}.ri svg{width:100%;height:auto}.ri-floorC{left:50%;transform:translateX(-50%)}.cat{width:100%;height:100%}.poses,.items{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.sample{padding:12px;text-align:center;border-radius:16px;background:#fffdf8}.sample .cat{width:100%;height:150px}.sample>svg.painted-asset{width:100%;height:140px}.sample p{margin:8px 0 0}.pose-study .paint-idle{display:none}.pose-study .paint-study{display:inline}@media(max-width:700px){body{padding:16px}.rooms{grid-template-columns:1fr}.poses,.items{grid-template-columns:repeat(3,1fr)}.sample .cat,.sample>svg.painted-asset{height:110px}.room{height:340px}}
</style></head><body><main>
<h1>냥공부 그림 확인</h1><p>승인한 시안에서 만든 실제 앱 그림입니다. 오른쪽은 물품을 모은 뒤의 배치 예시예요. <a href="/">냥공부로 돌아가기</a></p>
<div class="rooms"><section><h2>처음 · 빈 방</h2><div class="stage room" id="empty"></div></section><section><h2>물품을 모은 뒤 · 배치 예시</h2><div class="stage room" id="furnished"></div></section></div>
<h2>고양이 자세</h2><div class="poses" id="poses"></div><h2>꾸미기 물품</h2><div class="items" id="items"></div>
</main><script src="deco.js"></script><script src="painted.js"></script><script>
const cat=()=>`<div class="catwrap">${paintedCatSVG(false)}</div>`;
document.querySelector('#empty').innerHTML=cat();
document.querySelector('#furnished').innerHTML='<div class="rmwrap">'+['cloudrug','shelf','window','desk'].map(id=>{const i=RM_ITEMS.find(x=>x.id===id);return `<div class="ri ri-${i.slot}" style="width:${i.w}px">${i.svg}</div>`}).join('')+'</div>'+cat();
document.querySelector('#poses').innerHTML=[['앉기',''],['걷기','walking'],['잠자기','m-sleep'],['공부','pose-study'],['기쁨','happyface']].map(([name,cls])=>`<div class="sample">${paintedCatSVG(false).replace('cat painted-cat','cat painted-cat '+cls)}<p>${name}</p></div>`).join('');
document.querySelector('#items').innerHTML=RM_ITEMS.map(i=>`<div class="sample">${i.svg}<p>${i.n}</p></div>`).join('');
</script></body></html>
